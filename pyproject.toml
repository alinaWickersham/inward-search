[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threshold"
version = "0.1.0"
description = "A matching system for wellbeing experiences, with clinical safety constraints."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Phase 1: corpus generation
corpus = ["anthropic>=0.40"]
# Phase 2+: retrieval, extraction, orchestration
pipeline = [
    "langgraph>=0.2",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "numpy>=1.26",
]
# Phase 6: trained contraindication classifier
classifier = ["scikit-learn>=1.4"]
# Phase 7: API and tracing
api = ["fastapi>=0.110", "uvicorn>=0.29", "langfuse>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
